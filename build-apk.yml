name: Build StockPulse India APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android_app/**'
      - '.github/workflows/build-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.stockpulse.india .
      - name: Get dependencies
        run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: stockpulse-india-apk
          path: android_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
